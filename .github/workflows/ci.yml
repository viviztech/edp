name: Foundation quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edp_test
          POSTGRES_USER: edp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edp_test -d edp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://edp_test@localhost:5432/edp_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_TEST_DATABASE_URL: postgresql+psycopg://edp_test@localhost:5432/edp_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - run: pytest -q
      - run: python ../../scripts/export-openapi.py && git diff --exit-code -- ../../packages/api-contracts/openapi.json
      - run: pip-audit -r requirements.lock
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run contracts && git diff --exit-code -- src/lib/api-contracts.d.ts
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm audit --audit-level=high
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.0', cache: true}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze && flutter test && flutter build web --dart-define=API_BASE_URL=https://example.invalid/api/v1
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral local environment
        run: python -c "import pathlib,secrets; pathlib.Path('.env').write_text('POSTGRES_PASSWORD='+secrets.token_urlsafe(32)+'\nBFF_KEY='+secrets.token_urlsafe(32)+'\n')"
      - run: docker compose config --quiet && docker compose up --build -d --wait
      - run: python scripts/compose-smoke.py
      - if: always()
        run: docker compose down -v
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan working tree without emitting secret values
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3
          dir /repo --redact --exit-code 1

  browser-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edp_test
          POSTGRES_USER: edp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edp_test -d edp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://edp_test@localhost:5432/edp_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: cd apps/api && alembic upgrade head
      - run: npm ci && npm run build
        working-directory: apps/web
      - run: python scripts/run-foundation-browser-test.py
