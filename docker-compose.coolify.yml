x-api: &api
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  environment: &api-env
    APP_ENV: staging
    BFF_KEY: ${BFF_KEY:?}
    DATABASE_URL: postgresql+psycopg://edp:${POSTGRES_PASSWORD:?}@postgres:5432/edp
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    CORS_ORIGINS: '["${WEB_ORIGIN:?}"]'
    LMS_MATERIAL_ROOT: /private-materials
    LMS_MATERIAL_SIGNING_KEY: ${LMS_MATERIAL_SIGNING_KEY:?}
    LMS_MATERIAL_ACCESS_SECONDS: "300"
  volumes:
    - private_materials:/private-materials:ro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edp
      POSTGRES_USER: edp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *api
    restart: "no"
    exclude_from_hc: true
    command: ["sh", "-c", "alembic upgrade head && python -m app.modules.identity.cli seed"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s
  worker:
    <<: *api
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  beat:
    <<: *api
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/edp-celerybeat-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      BFF_KEY: ${BFF_KEY:?}
      COOKIE_SECURE: "true"
      PUBLIC_ORGANIZATION_ID: ${PUBLIC_ORGANIZATION_ID:-}
    expose: ["3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  private_materials:
