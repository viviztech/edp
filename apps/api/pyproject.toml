[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edp-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "redis>=5,<7",
  "argon2-cffi>=25,<26", "cryptography>=50,<51", "email-validator>=2,<3",
  "celery>=5.4,<6", "httpx>=0.28,<1", "structlog>=25,<26", "qrcode>=8.2,<9",
]

[project.optional-dependencies]
dev = ["playwright>=1.56,<2", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3", "types-qrcode>=8.2,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
